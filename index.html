ew li{margin:6px 0;padding:6px 10px;border-radius:6px}#review a{color:inherit;text-underline-offset:3px}

[3,'труды','Феодор Студит','Назовите пять пунктов из списка трудов Феодора Студита, включая два катехизиса.','Опровержения иконоборцев|Антирретики|Опровержение иконоборцев / Малый катехизис|Малое оглашение / Большой катехизис|Большое оглашение / Постановления / Монашеские уставы|Уставы','Антирретики, Малый катехизис, Большой катехизис, постановления, канонические послания','О магнезийце, Малый катехизис, Большой катехизис, постановления, монашеские уставы','Антирретики, Малый катехизис, Огласительные слова, постановления, монашеские уставы'],

[3,'патриаршества','Патриаршество Мефодия I','Когда Мефодий I занимал Константинопольскую кафедру?','843–847 гг.','842–847 гг.','843–858 гг.','844–847 гг.'],
[4,'труды','Никифор I','Назовите исторический труд Никифора I и два его сочинения против иконоборцев из карты.','Краткая история / Антирретики / О магнезийце','Краткая история, Антирретики, Три догматические послания','Краткая история, О магнезийце, Синодик в Неделю Православия','Библиотека, Антирретики, О магнезийце'],
[4,'труды','Мефодий I','Назовите «Синодик» Мефодия I и три других вида его сочинений.','Синодик в Неделю Православия|Синодик Православия|Синодик / Агиографические сочинения|Агиография|Жития|Житие Николая Чудотворца / Канонические сочинения|Канонические труды|Каноника / Литургическая поэзия|Литургические песнопения','Синодик в Неделю Православия, агиография, канонические сочинения, исторические сочинения','Синодик в Неделю Православия, агиография, антииконоборческие трактаты, литургическая поэзия','Синодик в Неделю Православия, Богородичные гомилии, канонические сочинения, литургическая поэзия'],
[4,'патриаршества','Первое патриаршество Фотия','Когда было первое патриаршество Фотия?','858–867 гг.','858–869 гг.','863–867 гг.','857–867 гг.'],
[4,'патриаршества','Второе патриаршество Фотия','Когда было второе патриаршество Фотия?','877–886 гг.','878–886 гг.','877–887 гг.','879–886 гг.'],
[4,'','','Назовите четыре труда Фотия из карты, включая два антилатинских.','Библиотека|Мириобиблион / Амфилохии / Окружное послание восточным патриархам|Окружное послание / Мистагогия','Библиотека, Амфилохии, Окружное послание восточным патриархам, Синодик в Неделю Православия','Библиотека, Краткая история, Окружное послание восточным патриархам, Мистагогия','Библиотека, Амфилохии, О магнезийце, Мистагогия'],
[5,'','','Какими годами датируется Фотианская схизма по карте?','863–867 гг.','858–867 гг.','863–869 гг.','861–867 гг.'],
[5,'соборы','Малый Софийский собор','Укажите годы Малого Софийского собора, поддержанного им патриарха и номер собора в католической традиции.','869–870 гг. / Игнатий|Игнатия / VIII Вселенский собор|VIII|8|8 Вселенский собор','869–870 гг., Фотий, VIII Вселенский собор','879–880 гг., Игнатий, VIII Вселенский собор','869–870 гг., Игнатий, VII Вселенский собор'],
[5,'соборы','Большой Софийский собор','Укажите годы Большого Софийского собора, поддержанного им патриарха и номер собора по греческой традиции, указанной в карте.','879–880 гг. / Фотий|Фотия / VIII Вселенский собор|VIII|8|8 Вселенский собор','879–880 гг., Игнатий, VIII Вселенский собор','869–870 гг., Фотий, VIII Вселенский собор','879–880 гг., Фотий, VII Вселенский собор'],
[5,'жизнь','Симеон Новый Богослов','Каковы приблизительные годы жизни Симеона Нового Богослова по карте?','Ок. 950 — ок. 1030 г.','Ок. 950 — ок. 1020 г.','Ок. 960 — ок. 1030 г.','Ок. 970 — ок. 1050 г.'],
[5,'','','Назовите четыре основных корпуса трудов Симеона Нового Богослова.','Гимны / Богословские слова / Нравственные слова / Огласительные слова|Оглашения','Гимны, Богословские слова, Нравственные слова, Канонические послания','Гимны, Богословские слова, Догматические послания, Огласительные слова','Гимны, Антирретики, Нравственные слова, Огласительные слова'],
[6,'','','Какими годами датируется «Македонский ренессанс» по карте?','867–1056 гг.','867–1025 гг.','866–1056 гг.','877–1057 гг.'],
[6,'','','Каковы годы жизни Никиты Стифата по карте? Укажите обе возможные даты смерти.','Начало XI в. — 1081/1092 гг.|нач. XI в. — 1081/1092|начало 11 века — 1081/1092','Начало XI в. — 1081/1095 гг.','Начало XI в. — 1071/1082 гг.','Конец X в. — 1081/1092 гг.'],
[6,'','','Назовите три направления полемики Никиты Стифата.','Антилатинская|Антилатинское|Против латинян / Антиармянская|Антиармянское|Против армян / Антииудейская|Антииудейское|Против иудеев','Антилатинская, антиармянская, антииконоборческая','Антилатинская, антииудейская, антиисламская','Антиармянская, антииудейская, антимонофелитская'],
[6,'','','Назовите три сочинения богословской трилогии Никиты Стифата.','О душе / О Рае / О небесной и церковной иерархии','О душе, О Рае, О божественных именах','О душе, О воскресении, О небесной и церковной иерархии','О душе, О Рае, О мистическом богословии']
];
const bank=rows.map(([seminar,group,short,question,key,...wrong],id)=>{
 const parts=key.split(' / ').map(part=>part.split('|'));
 return {id,seminar,group,short,question,parts,answer:parts.map(part=>part[0]).join(', '),wrong};
});
const titles={'эпохи':'Византийские периоды и их датировка','иконоборчество':'Периоды иконоборчества и их датировка','жизнь':'Авторы и годы их жизни','труды':'Авторы и их труды','патриаршества':'Патриаршества и их датировка','соборы':'Софийские соборы: годы, патриархи и нумерация'};
const byId=id=>document.getElementById(id);
const list=byId('questions'), checked=new Map();
let variant=0, order=[], dirty=false;
function shuffle(items){const copy=[...items];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy}
function add(parent,tag,text='',className=''){const el=document.createElement(tag);el.textContent=text;el.className=className;parent.append(el);return el}
function norm(text){return text.normalize('NFKC').toLowerCase().replace(/ё/g,'е').replace(/(^|[^\p{L}\p{N}])(?:ок|около|гг|г|год|годы|вв|в|век|века|веков|свт|прп|святитель|преподобный|патр|патриарх)(?=$|[^\p{L}\p{N}])/gu,'$1 ').replace(/[^\p{L}\p{N}]+/gu,' ').trim()}
function distance(a,b){
 const d=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));
 for(let i=0;i<=a.length;i++)d[i][0]=i;
 for(let j=0;j<=b.length;j++)d[0][j]=j;
 for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++){
  d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+Number(a[i-1]!==b[j-1]));
  if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);
 }
 return d[a.length][b.length];
}
function near(given,key){
 if(given===key)return true;
 const a=given.split(' '), b=key.split(' ');
 if(a.length!==b.length)return false;
 let errors=0;
 for(let i=0;i<b.length;i++){
  if(a[i]===b[i])continue;
  if(!/^[а-я]+$/.test(a[i])||!/^[а-я]+$/.test(b[i]))return false;
  errors+=distance(a[i],b[i]);if(errors>2)return false;
 }
 return true;
}
function writtenCorrect(item,raw){
 const given=raw.split(/[,;\n]+/).map(norm).filter(Boolean);
 if(given.length!==item.parts.length)return false;
 const keys=item.parts.map(part=>part.map(norm));
 function pair(index,used){return index===given.length||keys.some((aliases,i)=>!(used&(1<<i))&&aliases.some(alias=>near(given[index],alias))&&pair(index+1,used|(1<<i)))}
 return pair(0,0);
}
function update(){
 const right=[...checked.values()].filter(Boolean).length;
 byId('progress').textContent='Вариант '+(variant+1)+' · Проверено '+checked.size+' из '+bank.length;
 const score=byId('score');score.replaceChildren();
 add(score,'span','Верно: '+right,'count good');add(score,'span','Неверно: '+(checked.size-right),'count bad');add(score,'span','Осталось: '+(bank.length-checked.size),'muted');
 const review=byId('review');review.replaceChildren();
 if(checked.size!==bank.length)return;
 order.forEach((item,i)=>{
  const passed=checked.get(item.id), row=add(review,'li','',passed?'good':'bad');
  add(row,'a',(i+1)+'. '+(passed?'Верно':'Неверно')+' · '+item.question).href='#q'+item.id;
 });
}
function card(parent,item,mode,shared=[]){
 const number=order.push(item), article=add(parent,'article');article.id='q'+item.id;
 const written=mode==='written', matching=mode==='matching';
 add(article,'div','Вопрос '+number+(matching?'':' · Семинар '+item.seminar+' · '+(written?'Письменный ответ':'Выбор ответа')),'meta');
 const heading=add(article,'h3',matching?item.short:item.question);heading.id='heading'+item.id;
 const form=add(article,'form'), fields=add(form,'fieldset');fields.setAttribute('aria-labelledby',heading.id);
 let read;
 if(written){
  const label=add(fields,'label',item.parts.length>1?'Перечислите через запятую':'Впишите ответ');
  const input=add(label,'textarea');input.required=true;input.maxLength=450;input.rows=2;read=()=>input.value.trim();
 }else if(matching){
  const input=add(fields,'select');input.setAttribute('aria-labelledby',heading.id);input.required=true;
  add(input,'option','Выберите соответствие').value='';shared.forEach(answer=>{add(input,'option',answer).value=answer});read=()=>input.value;
 }else{
  for(const answer of shuffle([item.answer,...item.wrong])){
   const label=add(fields,'label','','choice'),input=add(label,'input');input.type='radio';input.name='answer';input.value=answer;input.required=true;add(label,'span',answer);
  }
  read=()=>form.elements.answer.value;
 }
 const submit=add(form,'button','Проверить');submit.type='submit';
 const notice=add(article,'div');notice.setAttribute('aria-live','polite');
 form.addEventListener('submit',event=>{
  event.preventDefault();if(checked.has(item.id))return;
  const answer=read();
  if(!answer){const input=fields.querySelector('textarea');if(input){input.value='';input.reportValidity()}return}
  const passed=written?writtenCorrect(item,answer):answer===item.answer;
  checked.set(item.id,passed);fields.disabled=true;submit.hidden=true;
  notice.className='feedback '+(passed?'good':'bad');add(notice,'strong',passed?'Верно':'Неверно');add(notice,'p',(written?'Пример правильного ответа':'Правильный ответ')+' — '+item.answer);update();
 });
}
function render(){
 list.replaceChildren();order=[];const cards=[];
 Object.keys(titles).forEach((group,i)=>{
  const items=bank.filter(item=>item.group===group), phase=(variant+i)%3;
  if(phase===0)cards.push({items:shuffle(items),mode:'matching',group});
  else items.forEach(item=>cards.push({items:[item],mode:phase===1?'written':'choice'}));
 });
 bank.filter(item=>!item.group).forEach(item=>cards.push({items:[item],mode:(item.id+variant)%2?'written':'choice'}));
 for(const {items,mode,group} of shuffle(cards)){
  if(mode!=='matching'){card(list,items[0],mode);continue}
  const section=add(list,'section','','matching');add(section,'div','Соответствия','meta');add(section,'h2',titles[group]);add(section,'p','Подберите вариант для каждой строки. В списке есть лишние ответы.','muted');
  const keys=items.map(item=>item.answer), extras=shuffle([...new Set(items.flatMap(item=>item.wrong))]).filter(answer=>!keys.includes(answer)).slice(0,2);
  const shared=shuffle([...keys,...extras]);items.forEach(item=>card(section,item,mode,shared));
 }
 update();
}
function change(){
 if(dirty&&checked.size<bank.length&&!window.confirm('Начать другой вариант? Ответы текущего варианта будут сброшены.'))return;
 variant++;checked.clear();dirty=false;render();byId('title').focus();window.scrollTo(0,0);
}
list.addEventListener('input',()=>{dirty=true});byId('change').addEventListener('click',change);byId('again').addEventListener('click',change);render();
</script></html>
